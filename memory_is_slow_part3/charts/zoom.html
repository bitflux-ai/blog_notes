<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not all operations are created equal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Memory is slow, Disk is fast - Part 3: "not all operations are created equal".
     A JS port of ../zoom (fframes). Same rows, timings and zoom curve; see the numbers below. */
  html, body { margin: 0; background: #f5f4f0; }
  .zoom { width: 100%; max-width: 1920px; margin: 0 auto; }
  .zoom svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="zoom" id="zoom"></div>
<script>
(() => {
  // A billion of each step, in seconds. One at a time: L1 1 s, L2 3.6 s, L3 18 s, DRAM 85 s
  // (typical latencies for the Xeon 8260), NVMe 87,000 s (fio, one PM983, 4 KiB at queue depth 1).
  // In flight, best measured: L3 2.4 s and DRAM 4.55 s, one core streaming 64 B lines (likwid,
  // Part 2.5: 24.8 and 13.1 GiB/s); NVMe 611 s, DiskArray's best drive read rate (6.24 GiB/s of 4 KiB).
  const GROUND = "#f5f4f0", INK = "#1c1b18", BODY = "#4a463c", MUTED = "#7a7568", FAINT = "#9a958a",
        TRACE = "#dcd6c6", RED = "#e01010", HEAD = "'Chakra Petch', sans-serif";
  const W = 1920, H = 1080, X0 = 470, AXIS_W = 1330, BAR_H = 46, DIVIDER_Y = 622, DIVIDER_AT = 11.4;
  const LENGTH = 23, HOLD = 2.5;                     // seconds; hold the last frame before looping

  const ROWS = [
    { label: "1 BILLION – L1 CACHE HITS", secs: 1,     value: "1 SECOND",    y: 290, red: false, hatch: false, grow: [0.6, 1.2] },
    { label: "1 BILLION – L2 CACHE HITS", secs: 3.6,   value: "3.6 SECONDS", y: 354, red: false, hatch: false, grow: [1.3, 1.9] },
    { label: "1 BILLION – L3 CACHE HITS", secs: 18,    value: "18 SECONDS",  y: 418, red: false, hatch: false, grow: [2.0, 2.9] },
    { label: "1 BILLION – DRAM MISSES",   secs: 85,    value: "1.4 MINUTES", y: 482, red: false, hatch: false, grow: [4.6, 5.4] },
    { label: "1 BILLION – NVMe READS",    secs: 87000, value: "24 HOURS",    y: 546, red: true,  hatch: false, grow: [5.8, 5.8] },
    { label: "1 BILLION – L3, IN PARALLEL",           secs: 2.4,   value: "2.4 SECONDS", y: 654, red: false, hatch: true,  grow: [13.0, 13.7] },
    { label: "1 BILLION – DRAM, IN PARALLEL",         secs: 4.55,  value: "4.5 SECONDS", y: 718, red: false, hatch: true,  grow: [13.8, 14.5] },
    { label: "1 BILLION – NVMe, IN PARALLEL",      secs: 611,   value: "10 MINUTES",  y: 782, red: true,  hatch: true,  grow: [16.8, 17.6] },
  ];
  // px per second of "billion-step time" at a video second; log-interpolated, eased
  const ZOOM = [
    [0, AXIS_W / 20], [3.4, AXIS_W / 20], [4.5, AXIS_W / 100], [5.8, AXIS_W / 100],
    [9.8, AXIS_W / 92000], [DIVIDER_AT, AXIS_W / 92000], [12.8, AXIS_W / 20], [15.0, AXIS_W / 20],
    [16.6, AXIS_W / 800], [19.0, AXIS_W / 800],
    [21.0, AXIS_W / 92000], [LENGTH, AXIS_W / 92000],   // back out to the full day to end the loop
  ];
  const STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 21600, 43200, 86400];

  const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  function pxPerSec(t) {
    for (let i = 1; i < ZOOM.length; i++) {
      const [t0, s0] = ZOOM[i - 1], [t1, s1] = ZOOM[i];
      if (t <= t1) {
        const k = t1 > t0 ? smooth((t - t0) / (t1 - t0)) : 1;
        return Math.exp(Math.log(s0) + (Math.log(s1) - Math.log(s0)) * k);
      }
    }
    return ZOOM[ZOOM.length - 1][1];
  }
  const tickStep = s => STEPS.find(st => st * s >= 150) ?? 86400;
  const tickLabel = v => v === 0 ? "0" : v < 60 ? `${v} s` : (v < 3600 || v % 3600) ? `${v / 60} min` : `${v / 3600} h`;

  // ---- build the SVG once
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Not all operations are created equal. A billion L1 cache hits take 1 second, L2 3.6 seconds, L3 18 seconds, DRAM misses 1.4 minutes, NVMe reads 24 hours. In parallel: a billion L3 hits 2.4 seconds, DRAM 4.5 seconds, NVMe reads 10 minutes." });
  const defs = el("defs", {}, svg);
  const clip = el("clipPath", { id: "zoom-plot" }, defs);
  el("rect", { x: X0, y: 0, width: AXIS_W, height: H }, clip);
  for (const [id, c] of [["zoom-hatch", RED], ["zoom-hatch-ink", INK]]) {
    const p = el("pattern", { id, width: 14, height: 14, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("rect", { width: 14, height: 14, fill: GROUND }, p);
    el("rect", { width: 5, height: 14, fill: c }, p);
  }
  el("rect", { width: W, height: H, fill: GROUND }, svg);

  const head = el("text", { "font-family": HEAD, "font-size": 56, "font-weight": 700, "letter-spacing": 0.6 }, svg);
  el("tspan", { x: 120, y: 180, fill: INK }, head, "NOT ALL OPERATIONS ");
  el("tspan", { fill: GROUND, stroke: RED, "stroke-width": 2 }, head, "ARE CREATED EQUAL");

  const tickLayer = el("g", {}, svg);
  const ticks = Array.from({ length: 16 }, () => {
    const g = el("g", {}, tickLayer);
    return {
      g,
      line: el("rect", { y: 280, width: 2, height: 580, fill: TRACE }, g),
      text: el("text", { y: 900, "font-family": HEAD, "font-size": 20, "font-weight": 500, "letter-spacing": 1, fill: MUTED, "text-anchor": "middle" }, g),
    };
  });
  el("rect", { x: X0 - 1, y: 280, width: 2, height: 580, fill: INK }, svg);

  const rows = ROWS.map(r => {
    const g = el("g", { opacity: 0 }, svg);
    const color = r.red ? RED : INK;
    el("text", { x: X0 - 24, y: r.y + 31, "font-family": HEAD, "font-size": 20, "font-weight": 600, "letter-spacing": 2,
                 fill: r.red ? RED : BODY, "text-anchor": "end" }, g, r.label);
    const bar = el("rect", { x: X0, y: r.y, height: BAR_H, width: 1.5, stroke: color, "stroke-width": 1.5, "clip-path": "url(#zoom-plot)",
                             fill: r.hatch ? (r.red ? "url(#zoom-hatch)" : "url(#zoom-hatch-ink)") : color }, g);
    const value = el("text", { y: r.y + 32, "font-family": HEAD, "font-size": 24, "font-weight": 700, "letter-spacing": 1 }, g);
    return { r, g, bar, value, color };
  });

  const divider = el("g", { opacity: 0 }, svg);
  el("rect", { x: 120, y: DIVIDER_Y, width: 1680, height: 2, fill: INK }, divider);
  el("rect", { x: 120, y: DIVIDER_Y - 15, width: 250, height: 30, fill: GROUND }, divider);
  el("text", { x: 120, y: DIVIDER_Y + 8, "font-family": HEAD, "font-size": 22, "font-weight": 700, "letter-spacing": 4, fill: RED }, divider, "MANY IN FLIGHT");

  el("text", { x: X0 + AXIS_W, y: 940, "font-family": HEAD, "font-size": 22, "font-weight": 600, "letter-spacing": 3,
               fill: MUTED, "text-anchor": "end" }, svg, "LINEAR SCALE");
  el("text", { x: 120, y: 1010, "font-family": HEAD, "font-size": 16, "font-weight": 500, "letter-spacing": 3.2, fill: FAINT }, svg,
     "ONE AT A TIME: TYPICAL LATENCY, NVMe FIO · IN FLIGHT: ONE-CORE STREAMING, BEST DISKARRAY RUN");

  // ---- one frame at video time t
  function draw(t) {
    const s = pxPerSec(t), step = tickStep(s), n = Math.floor(AXIS_W / (step * s));
    ticks.forEach((tk, i) => {
      if (i > n) { tk.g.setAttribute("display", "none"); return; }
      const v = i * step, x = X0 + v * s;
      tk.g.removeAttribute("display");
      tk.line.setAttribute("x", x - 1);
      tk.text.setAttribute("x", x);
      tk.text.textContent = tickLabel(v);
    });
    for (const { r, g, bar, value, color } of rows) {
      const [g0, g1] = r.grow;
      const k = g1 > g0 ? smooth((t - g0) / (g1 - g0)) : (t >= g0 ? 1 : 0);
      g.setAttribute("opacity", t >= g0 ? 1 : 0);
      const w = r.secs * s * k, end = X0 + w;
      bar.setAttribute("width", Math.max(1.5, Math.min(w, AXIS_W)));
      const inside = end > X0 + AXIS_W - 190;       // no room outside: put the value inside the bar
      const past = end > X0 + AXIS_W;
      value.setAttribute("x", inside ? Math.min(end, X0 + AXIS_W) - 14 : Math.max(end, X0) + 16);
      value.setAttribute("text-anchor", inside ? "end" : "start");
      value.setAttribute("fill", !inside || r.hatch ? color : GROUND);
      value.textContent = past ? `${r.value} →` : r.value;
    }
    divider.setAttribute("opacity", smooth((t - DIVIDER_AT) / 0.6));
  }

  document.getElementById("zoom").appendChild(svg);

  // ---- play: loop while on screen; reduced motion gets the last frame; ?t=14.8 freezes a moment
  const fixed = new URLSearchParams(location.search).get("t");
  if (fixed !== null) {
    draw(+fixed);
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => draw(+fixed));
    return;
  }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(LENGTH); return; }
  let visible = true, start = null, raf = null;
  function tick(now) {
    if (start === null) start = now;
    const t = ((now - start) / 1000) % (LENGTH + HOLD);
    draw(Math.min(t, LENGTH));
    raf = visible ? requestAnimationFrame(tick) : null;
  }
  draw(0);
  new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && raf === null) { start = null; raf = requestAnimationFrame(tick); }
  }, { threshold: 0.25 }).observe(svg);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => draw(0));
})();
</script>
</body>
</html>
